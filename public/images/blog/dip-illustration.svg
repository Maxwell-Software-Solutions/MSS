<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Dependency Inversion Principle</title>
  <desc>High-level OrderService depends on IPayment abstraction, implemented by Stripe and PayPal.</desc>
  <defs>
    <linearGradient id="bgDip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <pattern id="gridDip" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ababab" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentDip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818181"/>
      <stop offset="0.5" stop-color="#797979"/>
      <stop offset="1" stop-color="#7f7f7f"/>
    </linearGradient>
    <marker id="arrowDip" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#797979"/>
    </marker>
  </defs>
  <rect width="400" height="300" fill="url(#bgDip)"/>
  <rect width="400" height="300" fill="url(#gridDip)"/>
  <rect width="400" height="3" fill="url(#accentDip)"/>
  <text x="200" y="30" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="15" font-weight="700" fill="#f5f5f5">Dependency Inversion</text>
  <g font-family="'Segoe UI',Arial" font-size="10" font-weight="500" text-anchor="middle">
    <g transform="translate(100 100)">
      <rect x="-66" y="-32" width="132" height="62" rx="14" fill="#ababab" fill-opacity="0.1" stroke="#ababab" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-8" fill="#ababab" font-weight="700">OrderService</text>
      <text y="12" fill="#a6a6a6">+ placeOrder()</text>
    </g>
    <g transform="translate(300 100)">
      <rect x="-66" y="-32" width="132" height="62" rx="14" fill="#b4b4b4" fill-opacity="0.1" stroke="#b4b4b4" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-8" fill="#b4b4b4" font-weight="700">IPayment</text>
      <text y="12" fill="#a6a6a6">+ pay()</text>
    </g>
    <path d="M166 100H234" stroke="#797979" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowDip)"/>
    <g transform="translate(245 215)">
      <rect x="-54" y="-30" width="108" height="58" rx="12" fill="#d7b030" fill-opacity="0.08" stroke="#d7b030" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-4" fill="#d7b030" font-weight="700">StripePay</text>
    </g>
    <g transform="translate(355 215)">
      <rect x="-54" y="-30" width="108" height="58" rx="12" fill="#dbb844" fill-opacity="0.08" stroke="#dbb844" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-4" fill="#dbb844" font-weight="700">PayPalPay</text>
    </g>
    <path d="M300 132l-55 54" stroke="#b4b4b4" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M300 132l55 54" stroke="#b4b4b4" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="200" y="272" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="11" fill="#a6a6a6">High-level modules depend on abstractions</text>
</svg>
