<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Liskov Substitution Principle</title>
  <desc>Base Shape type with two substitutable derived types Rectangle and Circle.</desc>
  <defs>
    <linearGradient id="bgLsp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <pattern id="gridLsp" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ababab" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLsp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818181"/>
      <stop offset="0.5" stop-color="#797979"/>
      <stop offset="1" stop-color="#7f7f7f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgLsp)"/>
  <rect width="400" height="300" fill="url(#gridLsp)"/>
  <rect width="400" height="3" fill="url(#accentLsp)"/>
  <text x="200" y="30" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="15" font-weight="700" fill="#f5f5f5">Liskov Substitution</text>
  <g font-family="'Segoe UI',Arial" font-size="10" font-weight="500" text-anchor="middle">
    <g transform="translate(200 100)">
      <rect x="-64" y="-30" width="128" height="58" rx="14" fill="#ababab" fill-opacity="0.1" stroke="#ababab" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#ababab" font-weight="700">Shape</text>
      <text y="14" fill="#a6a6a6">+ area(): number</text>
    </g>
    <path d="M200 128L120 156" stroke="#797979" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <path d="M200 128L280 156" stroke="#797979" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(120 198)">
      <rect x="-54" y="-30" width="108" height="58" rx="14" fill="#d7b030" fill-opacity="0.08" stroke="#d7b030" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#d7b030" font-weight="700">Rectangle</text>
      <text y="14" fill="#a6a6a6">+ area()</text>
    </g>
    <g transform="translate(280 198)">
      <rect x="-54" y="-30" width="108" height="58" rx="14" fill="#dbb844" fill-opacity="0.08" stroke="#dbb844" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#dbb844" font-weight="700">Circle</text>
      <text y="14" fill="#a6a6a6">+ area()</text>
    </g>
  </g>
  <text x="200" y="262" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="11" fill="#a6a6a6">Subtypes safely substitute the base type</text>
</svg>
