<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Open Closed Principle</title>
  <desc>Base payment interface with three concrete strategy extensions.</desc>
  <defs>
    <linearGradient id="bgOcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <pattern id="gridOcp" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ababab" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentOcp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818181"/>
      <stop offset="0.5" stop-color="#797979"/>
      <stop offset="1" stop-color="#7f7f7f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgOcp)"/>
  <rect width="400" height="300" fill="url(#gridOcp)"/>
  <rect width="400" height="3" fill="url(#accentOcp)"/>
  <text x="200" y="30" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="15" font-weight="700" fill="#f5f5f5">Open / Closed</text>
  <g font-family="'Segoe UI',Arial" font-size="10" font-weight="500" text-anchor="middle">
    <g transform="translate(200 90)">
      <rect x="-70" y="-30" width="140" height="60" rx="14" fill="#ababab" fill-opacity="0.1" stroke="#ababab" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#ababab" font-weight="700">IPaymentMethod</text>
      <text y="14" fill="#a6a6a6">+ process()</text>
    </g>
    <path d="M200 120V144" stroke="#797979" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(100 190)">
      <rect x="-44" y="-30" width="88" height="58" rx="12" fill="#d7b030" fill-opacity="0.08" stroke="#d7b030" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#d7b030" font-weight="700">CreditCard</text>
    </g>
    <g transform="translate(200 190)">
      <rect x="-44" y="-30" width="88" height="58" rx="12" fill="#dbb844" fill-opacity="0.08" stroke="#dbb844" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#dbb844" font-weight="700">PayPal</text>
    </g>
    <g transform="translate(300 190)">
      <rect x="-44" y="-30" width="88" height="58" rx="12" fill="#b4b4b4" fill-opacity="0.08" stroke="#b4b4b4" stroke-opacity="0.4" stroke-width="1.5"/>
      <text y="-6" fill="#b4b4b4" font-weight="700">Crypto</text>
    </g>
  </g>
  <text x="200" y="254" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="11" fill="#a6a6a6">Extend with new types</text>
  <text x="200" y="270" text-anchor="middle" font-family="'Segoe UI',Arial" font-size="11" fill="#777777">No core modification needed</text>
</svg>
