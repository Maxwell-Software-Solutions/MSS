name: Preview UI checks
on: [pull_request]
jobs:
  ui:
    # Pinned: ubuntu-latest is now 26.04, where Playwright 1.56 cannot install its browsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      # Playwright starts the built site itself (webServer in playwright.config.ts)
      - run: npx playwright test
        env:
          PLAYWRIGHT_PROD: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
